<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Citely — Grounded answers from your own documents</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Citely answers questions only from your company documents, quotes and cites the passages it used, and declines questions the documents do not cover.">
  <meta name="theme-color" content="#0c0c0c">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <!-- Apply the saved (or system) theme before first paint to avoid a flash -->
  <script>
    (function () {
      var t = new URLSearchParams(location.search).get('theme');
      if (t !== 'light' && t !== 'dark') {
        try { t = localStorage.getItem('citely-theme'); } catch (e) {}
      }
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.style.colorScheme = t;
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
